<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Quick Work Log</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>Quick Work Log</h1><p id="message" role="status" aria-live="polite"></p><form id="work-log-form" novalidate>
<label for="summary">作業名 <span>*</span></label><input id="summary" name="summary" autofocus>
<label for="startDate">開始日 <span>*</span></label><input id="startDate" name="startDate" type="date">
<label for="startTime">開始時刻 <span>*</span></label><input id="startTime" name="startTime" type="time">
<label for="endDate">終了日 <span>*</span></label><input id="endDate" name="endDate" type="date">
<label for="endTime">終了時刻 <span>*</span></label><input id="endTime" name="endTime" type="time">
<label for="description">作業内容・メモ</label><textarea id="description" name="description"></textarea>
<label for="calendarId">登録先カレンダー <span>*</span></label><select id="calendarId" name="calendarId"><option value="">カレンダーを選択してください</option></select>
<label for="location">場所</label><input id="location" name="location">
<label for="categoryId">作業カテゴリ <span>*</span></label><select id="categoryId" name="categoryId"><option value="">カテゴリを追加してください</option></select><div><button type="button" id="add-category">カテゴリ追加</button><button type="button" id="edit-category" disabled>編集</button><button type="button" id="delete-category" disabled>削除</button></div>
<button type="submit">登録</button></form><dialog id="category-dialog"><form method="dialog" id="category-form"><label for="categoryName">カテゴリ名</label><input id="categoryName" required><label for="categoryColor">予定色</label><select id="categoryColor" required></select><button value="cancel">キャンセル</button><button id="save-category" value="default">保存</button></form></dialog></main><script type="module" src="popup.js"></script></body></html>
